[SMELT]

;maximum amount of ingot-equivalents received when breaking down weapons.
;If scrap conversion is enabled, this cap is applied BEFORE the scrap multiplier.
Weapon cap = 0

;maximum amount of ingot-equivalents received when breaking down armor
Armor cap = 0

;maximum amount of ingot-equivalents received when breaking down jewelry
Jewelry cap = 0

;maximum amount of ingot-equivalents received when breaking down clutter
Clutter cap = 0


[SCRAP]

;convert CRD-generated metal/ingot recovery into DRIT scrap
Enabled = true

;1.00 means one ingot-equivalent becomes 2 scrap.
;0.50 means one ingot-equivalent becomes 1 scrap.
;1.50 means one ingot-equivalent becomes 3 scrap.
;Fractional results are rounded down, with a minimum of 1 scrap for a valid recovery recipe.
YieldMultiplier = 1.00


[BREAKDOWN_FAILURE]

;applies ONLY to CRD-generated breakdown recipes.
;Vanilla recipes, other mods' recipes, DRIT scrap recovery recipes, and tempering are not affected.
Enabled = true

;failure chance when Smithing skill exactly equals material difficulty
SmeltingBaseFailure = 15.0
TanningBaseFailure = 10.0

;percentage-point change in failure chance per point of difference between
;material difficulty and Smithing skill
SmeltingSkillFactor = 1.0
TanningSkillFactor = 0.75

;final failure chance clamp
MinimumFailure = 0.0
MaximumFailure = 75.0

;show a normal HUD notification when a breakdown fails
NotifyFailure = true

;write each CRD breakdown roll to the SKSE log
DebugLog = false


[MATERIAL_DIFFICULTY]

;Source-item material determines difficulty when CRD can identify it.
;For jewelry/clutter or unknown source materials, recovered material is used as fallback.

Iron = 0
Steel = 20
